<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640">
  <!-- "Derp", the AUTISTIK background mascot: a big-brain blob with a propeller cap, googly eyes and a happy tongue. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B7CFF"/><stop offset="1" stop-color="#5B36D6"/></linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC2D9"/><stop offset="1" stop-color="#FF8DB8"/></linearGradient>
    <linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#E5484D"/><stop offset=".33" stop-color="#F0B90B"/><stop offset=".66" stop-color="#22C55E"/><stop offset="1" stop-color="#6141D4"/></linearGradient>
    <radialGradient id="shine" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="300" cy="606" rx="170" ry="22" fill="#141830" opacity=".18"/>

  <!-- feet -->
  <ellipse cx="236" cy="590" rx="46" ry="22" fill="#4A2BB8"/>
  <ellipse cx="366" cy="590" rx="46" ry="22" fill="#4A2BB8"/>

  <!-- waving arm (left) -->
  <path d="M138 400c-40-18-70-60-74-104" fill="none" stroke="#6E4CE8" stroke-width="34" stroke-linecap="round"/>
  <circle cx="62" cy="288" r="28" fill="#7C5CF0"/>
  <path d="M40 262l-10-18M58 256l-4-22M78 260l6-20" stroke="#7C5CF0" stroke-width="12" stroke-linecap="round"/>

  <!-- arm holding the infinity lollipop (right) -->
  <path d="M462 420c34-10 58-36 66-70" fill="none" stroke="#6E4CE8" stroke-width="34" stroke-linecap="round"/>
  <path d="M530 344V196" stroke="#E9E4F7" stroke-width="10" stroke-linecap="round"/>
  <path d="M500 168c-18 0-30 11-30 24s12 24 30 24c14 0 24-11 37-24 13-13 23-24 37-24 18 0 30 11 30 24s-12 24-30 24c-14 0-24-11-37-24-13-13-23-24-37-24z" fill="none" stroke="url(#spec)" stroke-width="12" stroke-linecap="round" transform="translate(-7 0)"/>
  <circle cx="530" cy="350" r="24" fill="#7C5CF0"/>

  <!-- body -->
  <path d="M300 168c120 0 196 70 196 196 0 140-80 228-196 228S104 504 104 364c0-126 76-196 196-196z" fill="url(#body)"/>
  <path d="M300 168c120 0 196 70 196 196 0 140-80 228-196 228S104 504 104 364c0-126 76-196 196-196z" fill="url(#shine)"/>

  <!-- big brain bulging out of the top -->
  <path d="M168 214c-22-30-6-74 32-78 6-38 52-58 84-36 26-30 78-24 92 12 40-6 70 30 56 66 24 22 16 58-10 66-180 22-200 22-254-30z" fill="url(#brain)" stroke="#E0457B" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#E0457B" stroke-width="5" stroke-linecap="round">
    <path d="M208 180c14 4 20 18 12 30"/>
    <path d="M262 132c-4 18 12 26 6 44"/>
    <path d="M322 128c14 10 6 30 20 40"/>
    <path d="M388 176c-14 6-12 24-26 30"/>
    <path d="M240 222c18-10 34 4 52-2"/>
  </g>

  <!-- propeller cap -->
  <path d="M244 112c4-50 108-50 112 0z" fill="#F0B90B"/>
  <path d="M262 112c2-32 20-46 38-48v48zM300 64c18 2 36 16 38 48h-38z" fill="#22C3B6"/>
  <rect x="236" y="106" width="128" height="14" rx="7" fill="#141830"/>
  <path d="M300 64V40" stroke="#141830" stroke-width="6" stroke-linecap="round"/>
  <path d="M248 40c20-16 36-8 52 0 16-8 32-16 52 0-20 10-36 4-52 0-16 4-32 10-52 0z" fill="#E5484D"/>
  <circle cx="300" cy="40" r="7" fill="#141830"/>

  <!-- googly eyes, looking two ways at once -->
  <circle cx="232" cy="332" r="54" fill="#fff" stroke="#141830" stroke-width="6"/>
  <circle cx="378" cy="322" r="66" fill="#fff" stroke="#141830" stroke-width="6"/>
  <circle cx="214" cy="348" r="22" fill="#141830"/>
  <circle cx="404" cy="300" r="27" fill="#141830"/>
  <circle cx="206" cy="340" r="7" fill="#fff"/>
  <circle cx="394" cy="290" r="9" fill="#fff"/>

  <!-- blush -->
  <ellipse cx="176" cy="414" rx="26" ry="15" fill="#FF8DB8" opacity=".7"/>
  <ellipse cx="438" cy="414" rx="26" ry="15" fill="#FF8DB8" opacity=".7"/>

  <!-- big happy mouth, one tooth, tongue out -->
  <path d="M214 420c40 64 150 66 190-4-56 18-126 20-190 4z" fill="#2A1450" stroke="#141830" stroke-width="6" stroke-linejoin="round"/>
  <rect x="280" y="422" width="30" height="30" rx="6" fill="#fff" stroke="#141830" stroke-width="4"/>
  <path d="M332 452c8 34 44 48 58 22 8-16-6-34-22-40z" fill="#FF6B9A" stroke="#141830" stroke-width="5" stroke-linejoin="round"/>
  <path d="M352 452c6 10 12 16 22 18" fill="none" stroke="#E0457B" stroke-width="4" stroke-linecap="round"/>

  <!-- little infinity badge on the belly -->
  <path d="M272 532c-10 0-17 6-17 13s7 13 17 13c8 0 13-6 20-13 7-7 12-13 20-13 10 0 17 6 17 13s-7 13-17 13c-8 0-13-6-20-13-7-7-12-13-20-13z" fill="none" stroke="#F0B90B" stroke-width="6" stroke-linecap="round" transform="translate(8 0)"/>
</svg>
