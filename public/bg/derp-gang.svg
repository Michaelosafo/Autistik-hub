<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460">
  <!-- The Derp gang: three Derps hanging out, with confetti. -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B7CFF"/><stop offset="1" stop-color="#5B36D6"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0F9F8F"/></linearGradient>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#F08C0B"/></linearGradient>
    <g id="face">
      <path d="M-34 30c18 24 56 24 70-4-24 8-48 10-70 4z" fill="#2A1450" stroke="#141830" stroke-width="4"/>
      <path d="M14 38c4 14 20 20 26 6 3-8-4-14-10-16z" fill="#FF6B9A" stroke="#141830" stroke-width="4"/>
    </g>
  </defs>
  <g fill="#F0B90B"><rect x="80" y="40" width="12" height="6" rx="2" transform="rotate(30 80 40)"/><rect x="620" y="60" width="12" height="6" rx="2" transform="rotate(-20 620 60)"/><rect x="340" y="20" width="12" height="6" rx="2"/></g>
  <g fill="#E5484D"><rect x="200" y="70" width="12" height="6" rx="2" transform="rotate(-40 200 70)"/><rect x="520" y="30" width="12" height="6" rx="2" transform="rotate(50 520 30)"/></g>
  <g fill="#22D3EE"><rect x="440" y="90" width="12" height="6" rx="2" transform="rotate(10 440 90)"/><rect x="120" y="120" width="12" height="6" rx="2" transform="rotate(60 120 120)"/></g>
  <ellipse cx="360" cy="440" rx="320" ry="18" fill="#141830" opacity=".12"/>

  <!-- left: teal Derp with headphones -->
  <g transform="translate(150 300)">
    <path d="M0-110c70 0 112 40 112 112 0 74-46 120-112 120S-112 76-112 2c0-72 42-112 112-112z" fill="url(#t)"/>
    <path d="M-96-20c0-70 40-104 96-104s96 34 96 104" fill="none" stroke="#141830" stroke-width="12"/>
    <rect x="-118" y="-36" width="34" height="60" rx="14" fill="#E5484D" stroke="#141830" stroke-width="5"/><rect x="84" y="-36" width="34" height="60" rx="14" fill="#E5484D" stroke="#141830" stroke-width="5"/>
    <circle cx="-30" cy="-16" r="26" fill="#fff" stroke="#141830" stroke-width="5"/><circle cx="32" cy="-20" r="30" fill="#fff" stroke="#141830" stroke-width="5"/>
    <circle cx="-38" cy="-8" r="11" fill="#141830"/><circle cx="44" cy="-30" r="13" fill="#141830"/>
    <use href="#face" transform="translate(0 20)"/>
  </g>

  <!-- middle: purple Derp with sunglasses and big brain -->
  <g transform="translate(360 270)">
    <path d="M0-140c86 0 140 50 140 140 0 92-56 150-140 150S-140 92-140 0c0-90 54-140 140-140z" fill="url(#v)"/>
    <path d="M-96-100c-16-24 0-56 28-58 4-30 40-44 64-26 18-22 58-18 68 8 30-4 50 22 40 48" fill="#FFB3CC" stroke="#E0457B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-104-10h208" stroke="#141830" stroke-width="8"/>
    <rect x="-98" y="-24" width="86" height="50" rx="20" fill="#141830"/><rect x="12" y="-24" width="86" height="50" rx="20" fill="#141830"/>
    <path d="M-84-12h30M26-12h30" stroke="#F0B90B" stroke-width="6" stroke-linecap="round"/>
    <use href="#face" transform="translate(0 50) scale(1.3)"/>
    <path d="M-30 128c-8 0-13 5-13 10s5 10 13 10c6 0 10-5 15-10 5-5 9-10 15-10 8 0 13 5 13 10s-5 10-13 10c-6 0-10-5-15-10-5-5-9-10-15-10z" fill="none" stroke="#F0B90B" stroke-width="6" stroke-linecap="round" transform="translate(15 -10)"/>
  </g>

  <!-- right: orange Derp with a party hat, waving -->
  <g transform="translate(580 310)">
    <path d="M0-100c64 0 102 36 102 102 0 68-42 110-102 110S-102 70-102 2c0-66 38-102 102-102z" fill="url(#o)"/>
    <path d="M-30-96L8-190 44-94z" fill="#6141D4" stroke="#141830" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="8" cy="-192" r="10" fill="#F0B90B"/>
    <path d="M-14-150h40M-24-120h58" stroke="#F0B90B" stroke-width="5"/>
    <circle cx="-28" cy="-10" r="28" fill="#fff" stroke="#141830" stroke-width="5"/><circle cx="34" cy="-4" r="22" fill="#fff" stroke="#141830" stroke-width="5"/>
    <circle cx="-16" cy="-22" r="12" fill="#141830"/><circle cx="26" cy="4" r="9" fill="#141830"/>
    <use href="#face" transform="translate(0 30)"/>
    <path d="M96-10c24-16 36-40 36-66" stroke="#E68A0B" stroke-width="22" stroke-linecap="round" fill="none"/>
