[package]
name = "autistik-locker"
version = "1.0.0"
description = "AUTISTIK Solana Locker: LP tokens locked until a date, only the creator can claim them back"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "autistik_locker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = { version = "0.29.0", default-features = false, features = ["token"] }

# Not part of the Hub's npm workspace.
[workspace]
