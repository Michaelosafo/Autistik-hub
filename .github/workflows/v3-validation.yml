name: V3 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [v3-vanity-addresses]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-build:
    name: Install and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
